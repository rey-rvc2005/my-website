<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Follow Me</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ⚡ lightning flash effect */
.flash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
    animation: lightning 5s infinite;
}

@keyframes lightning {
    0%, 92%, 100% { opacity: 0; }
    93% { opacity: 0.8; }
    94% { opacity: 0; }
    96% { opacity: 1; }
    97% { opacity: 0; }
}

/* 🔥 fire glow background */
.fire {
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,80,0,0.4), transparent 60%);
    animation: moveFire 6s infinite alternate;
    filter: blur(40px);
}

@keyframes moveFire {
    0% { transform: translate(-20%, -20%) scale(1); }
    100% { transform: translate(10%, 10%) scale(1.3); }
}

/* main content */
#main {
    z-index: 2;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 28px;
    text-shadow: 0 0 10px red, 0 0 20px orange;
}

/* 🐉 dragon fire glow text */
.dragon {
    font-size: 18px;
    color: #ff4d00;
    text-shadow: 0 0 10px red, 0 0 20px orange, 0 0 30px yellow;
    animation: glow 1s infinite alternate;
}

@keyframes glow {
    from { opacity: 0.6; transform: scale(1); }
    to { opacity: 1; transform: scale(1.05); }
}

button {
    margin-top: 20px;
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #1877f2;
    color: white;
    font-weight: bold;
    box-shadow: 0 0 20px #1877f2;
}

/* 🔥 floating particles */
.particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: orange;
    border-radius: 50%;
    animation: float 4s linear infinite;
}

@keyframes float {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="fire"></div>
<div class="flash"></div>

<div id="main">
    <h1>⚡ DRAGON FIRE PROFILE ⚡</h1>
    <div class="dragon">🐉 Tap anywhere to enter the fire zone</div>
    <button onclick="goFB()">Visit Facebook Profile</button>
</div>

<script>
// Facebook link
function goFB(){
    window.location.href = "https://www.facebook.com/reymart.villacampa.cadalso";
}

// tap anywhere redirect
document.addEventListener("click", function(){
    goFB();
});

// 🔥 generate fire particles
for(let i = 0; i < 25; i++){
    let p = document.createElement("div");
    p.classList.add("particle");
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(p);
}
</script>

</body>
</html>
